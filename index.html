function fire(){const c=$('#fc'),x=c.getContext('2d');let W,H,P=[];const rs=()=>{W=c.width=innerWidth;H=c.height=innerHeight};rs();addEventListener('resize',rs);
 (function t(){if(!c.isConnected)return;x.globalCompositeOperation='source-over';x.fillStyle='rgba(8,0,26,.3)';x.fillRect(0,0,W,H);x.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++)P.push({x:W*(.1+Math.random()*.8),y:H+20,vx:(Math.random()-.5)*.8,vy:-(2+Math.random()*4),r:22+Math.random()*44,l:1});
  P=P.filter(p=>p.l>0);
  for(const p of P){p.x+=p.vx+Math.sin(p.y/35+p.x)*.7;p.y+=p.vy;p.l-=.012;p.r*=.986;
   const g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);g.addColorStop(0,`rgba(${190+60*p.l|0},${80+90*p.l|0},255,${p.l*.55})`);g.addColorStop(1,'rgba(80,0,190,0)');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
  requestAnimationFrame(t)})()}
